<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fading Furigana</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>Fading Furigana</h1>
          <p id="build-version">v0.1.0</p>
        </div>
        <strong id="status-text">Ready</strong>
      </header>

      <section class="panel status-panel" aria-label="Current page" data-i18n-aria="currentPage">
        <div class="status-panel__row">
          <span>
            <small data-i18n="currentSite">Current site</small>
            <strong id="site-host">—</strong>
          </span>
          <button id="site-toggle" type="button" data-i18n="pauseSite">Pause site</button>
        </div>
        <p id="page-status" class="status-panel__text">—</p>
        <p id="access-text" class="status-panel__text status-panel__text--muted">—</p>
      </section>

      <section class="panel quick-panel" aria-label="Quick annotation controls" data-i18n-aria="quickControls">
        <label class="switch-row switch-row--primary">
          <span>
            <strong data-i18n="annotations">Annotations</strong>
            <small data-i18n="annotationsHint">Control this browser's annotation behavior</small>
          </span>
          <input id="annotation-enabled" type="checkbox" />
        </label>

        <div class="settings-grid">
          <label class="field">
            <span data-i18n="displayStyle">Display</span>
            <select id="display-style">
              <option value="tap_only" data-i18n="displayAuto">Auto</option>
              <option value="ruby" data-i18n="displayRuby">Ruby</option>
              <option value="compact" data-i18n="displayCompact">Tap hints</option>
            </select>
          </label>

          <label class="field">
            <span data-i18n="knownLevel">Level</span>
            <select id="user-level">
              <option value="none" data-i18n="levelAll">All</option>
              <option value="n5">N5</option>
              <option value="n4">N4</option>
              <option value="n3">N3</option>
              <option value="n2">N2</option>
              <option value="n1">N1</option>
            </select>
          </label>
        </div>

        <details class="advanced">
          <summary data-i18n="moreControls">More controls</summary>
          <div class="advanced__content">
            <label class="field">
              <span data-i18n="mode">Focus</span>
              <select id="annotation-mode">
                <option value="adaptive" data-i18n="modeAdaptive">Adaptive</option>
                <option value="all_items" data-i18n="modeAllItems">All items</option>
                <option value="unknown_items_only" data-i18n="modeUnknownOnly">Unknown only</option>
                <option value="saved_items_only" data-i18n="modeSavedOnly">Saved only</option>
                <option value="off" data-i18n="modeOff">Off</option>
              </select>
            </label>

            <label class="field">
              <span data-i18n="interfaceLanguage">Language</span>
              <select id="interface-language">
                <option value="zhHans">中文</option>
                <option value="en">English</option>
              </select>
            </label>

            <label class="switch-row">
              <span>
                <strong data-i18n="smartContextDisplay">Smart compact areas</strong>
                <small data-i18n="smartContextDisplayHint">Use tap hints in titles, links, and search results</small>
              </span>
              <input id="smart-context-display" type="checkbox" />
            </label>

            <label class="switch-row">
              <span>
                <strong data-i18n="hideKnownWords">Hide known words</strong>
                <small data-i18n="hideKnownWordsHint">Fade out words already mastered</small>
              </span>
              <input id="hide-known-items" type="checkbox" />
            </label>

            <label class="switch-row">
              <span>
                <strong data-i18n="dailyWordStats">Daily word stats</strong>
                <small data-i18n="dailyWordStatsHint">Count words seen each day</small>
              </span>
              <input id="exposure-enabled" type="checkbox" />
            </label>

            <label class="field">
              <span data-i18n="urlPrivacy">URL privacy</span>
              <select id="url-privacy">
                <option value="domain_only" data-i18n="urlDomainOnly">Domain only</option>
                <option value="full" data-i18n="urlFull">Full URL</option>
                <option value="none" data-i18n="urlNone">No URL</option>
              </select>
            </label>
          </div>
        </details>
      </section>

      <section class="summary-grid" aria-label="Today" data-i18n-aria="todaySummary">
        <div class="summary-tile">
          <span data-i18n="seenToday">Seen today</span>
          <strong id="seen-today-count">0</strong>
        </div>
        <div class="summary-tile">
          <span data-i18n="savedWords">Saved words</span>
          <strong id="saved-count">0</strong>
        </div>
      </section>

      <section class="panel panel--compact diagnostics" aria-label="Storage status" data-i18n-aria="storageStatus">
        <div class="diagnostics__row">
          <span data-i18n="storage">Storage</span>
          <strong id="storage-mode" class="diagnostics__value">—</strong>
        </div>
        <div class="diagnostics__row">
          <span data-i18n="lastUpdated">Updated</span>
          <strong id="last-updated" class="diagnostics__value">—</strong>
        </div>
      </section>

      <section class="panel panel--compact loopback" id="loopback-panel" hidden aria-label="Mac app connection" data-i18n-aria="macAppConnection">
        <div class="diagnostics__row">
          <span data-i18n="macAppConnection">Mac app</span>
          <strong id="loopback-status" class="diagnostics__value">—</strong>
        </div>
        <div class="loopback__pair">
          <input id="loopback-code" type="text" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          <button id="loopback-connect" type="button" data-i18n="connect">Connect</button>
          <button id="loopback-disconnect" type="button" hidden data-i18n="disconnect">Disconnect</button>
        </div>
        <p id="loopback-hint" class="status-panel__text status-panel__text--muted" data-i18n="macAppHint">Enter the pairing code from the Mac app's Settings › Extensions.</p>
      </section>

      <footer class="popup__footer">
        <span id="footer-version">v0.1.0</span>
        <div class="popup__actions">
          <button id="open-full-settings" type="button" data-i18n="fullSettings">Full settings</button>
          <button id="refresh-stats" type="button" data-i18n="refresh">Refresh</button>
        </div>
      </footer>
    </main>

    <script src="../core/appState.js"></script>
    <script src="../storage/localStorageAdapter.js"></script>
    <script src="../storage/recordBatchCodec.js"></script>
    <script src="../storage/safariNativeStorageAdapter.js"></script>
    <script src="../storage/chromeLoopbackClient.js"></script>
    <script src="../storage/chromeStorageAdapter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
