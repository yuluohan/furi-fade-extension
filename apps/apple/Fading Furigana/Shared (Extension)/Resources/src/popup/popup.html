<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fading Furigana</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>Fading Furigana</h1>
          <p id="build-version">v0.1.0</p>
        </div>
        <p id="status-text">Ready</p>
      </header>

      <section class="panel panel--compact" aria-label="Display settings" data-i18n-aria="displaySettings">
        <label class="field">
          <span data-i18n="interfaceLanguage">Language</span>
          <select id="interface-language">
            <option value="zhHans">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </section>

      <section class="panel" aria-label="Annotation settings" data-i18n-aria="annotationSettings">
        <div class="switch-grid">
          <label class="switch-row">
            <span>
              <strong data-i18n="annotations">Annotations</strong>
              <small data-i18n="annotationsHint">Show reading hints on Japanese words</small>
            </span>
            <input id="annotation-enabled" type="checkbox" />
          </label>

          <label class="switch-row">
            <span>
              <strong data-i18n="hideKnownWords">Hide known words</strong>
              <small data-i18n="hideKnownWordsHint">Fade out words already mastered</small>
            </span>
            <input id="hide-known-items" type="checkbox" />
          </label>

          <label class="switch-row">
            <span>
              <strong data-i18n="smartContextDisplay">Smart compact areas</strong>
              <small data-i18n="smartContextDisplayHint">Use tap hints in titles, navigation, and search results</small>
            </span>
            <input id="smart-context-display" type="checkbox" />
          </label>
        </div>

        <div class="settings-grid">
          <label class="field">
            <span data-i18n="mode">Mode</span>
            <select id="annotation-mode">
              <option value="adaptive" data-i18n="modeAdaptive">Adaptive</option>
              <option value="all_items" data-i18n="modeAllItems">All items</option>
              <option value="unknown_items_only" data-i18n="modeUnknownOnly">Unknown only</option>
              <option value="saved_items_only" data-i18n="modeSavedOnly">Saved only</option>
              <option value="off" data-i18n="modeOff">Off</option>
            </select>
          </label>

          <label class="field">
            <span data-i18n="knownLevel">Known up to</span>
            <select id="user-level">
              <option value="none" data-i18n="levelNone">None</option>
              <option value="n5">N5</option>
              <option value="n4">N4</option>
              <option value="n3">N3</option>
              <option value="n2">N2</option>
              <option value="n1">N1</option>
            </select>
          </label>

          <label class="field">
            <span data-i18n="displayStyle">Display style</span>
            <select id="display-style">
              <option value="tap_only" data-i18n="displayAuto">Auto</option>
              <option value="ruby" data-i18n="displayRuby">Ruby</option>
              <option value="compact" data-i18n="displayCompact">Tap hints</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel" aria-label="Exposure tracking settings" data-i18n-aria="exposureSettings">
        <div class="switch-grid">
          <label class="switch-row">
            <span>
              <strong data-i18n="dailyWordStats">Daily word stats</strong>
              <small data-i18n="dailyWordStatsHint">Count words seen each day</small>
            </span>
            <input id="exposure-enabled" type="checkbox" />
          </label>

          <label class="field">
            <span data-i18n="urlPrivacy">URL privacy</span>
            <select id="url-privacy">
              <option value="domain_only" data-i18n="urlDomainOnly">Domain only</option>
              <option value="full" data-i18n="urlFull">Full URL</option>
              <option value="none" data-i18n="urlNone">No URL</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel stats-panel" aria-label="Vocabulary frequency" data-i18n-aria="vocabularyFrequency">
        <div class="stats-panel__header">
          <strong data-i18n="wordFrequency">Word frequency</strong>
          <button id="refresh-stats" type="button" aria-label="Refresh stats" data-i18n="refresh" data-i18n-aria="refreshStats">Refresh</button>
        </div>
        <div class="stats-grid">
          <div>
            <h2 data-i18n="today">Today</h2>
            <ol id="today-stats" class="word-list"></ol>
          </div>
          <div>
            <h2 data-i18n="sevenDays">7 days</h2>
            <ol id="week-stats" class="word-list"></ol>
          </div>
        </div>
      </section>

      <section class="panel panel--compact diagnostics" aria-label="Storage status" data-i18n-aria="storageStatus">
        <div class="diagnostics__row">
          <span data-i18n="storage">Storage</span>
          <strong id="storage-mode" class="diagnostics__value">—</strong>
        </div>
        <div class="diagnostics__row">
          <span data-i18n="lastUpdated">Last updated</span>
          <strong id="last-updated" class="diagnostics__value">—</strong>
        </div>
      </section>

      <footer class="popup__footer">
        <span id="footer-version">v0.1.0</span>
        <div class="popup__actions">
          <button id="reset-settings" type="button" data-i18n="reset">Reset</button>
          <button id="save-settings" type="button" data-i18n="save">Save</button>
        </div>
      </footer>
    </main>

    <script src="../core/appState.js"></script>
    <script src="../storage/localStorageAdapter.js"></script>
    <script src="../storage/safariNativeStorageAdapter.js"></script>
    <script src="../storage/chromeStorageAdapter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
